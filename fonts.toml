# font-library 字型清單（唯一正本）
#
# 每套字型一筆 [[font]]。改這個檔之後跑：
#   python3 scripts/fontlib.py check      # 檢查欄位
#   python3 scripts/fontlib.py fetch <id> # 下載並把 sha256 寫進 fonts.lock.json
#
# 欄位說明見 README.md「清單格式」。授權欄位要讀過上游授權原文才填，
# 並在 verified 寫查證日期；不要從部落格或記憶抄。

schema = 1

# ───────────── 注音字型（bpmfvs 規格，ButTaiwan） ─────────────

[[font]]
id = "bpmf-zihi-kai-std"
name = "字嗨注音標楷"
name_en = "Bpmf Zihi Kai Std"
style = "楷書"
features = ["注音", "IVS 選破音字"]
use = ["低年級學習單", "識字教材", "注音網頁"]
notes = "依教育部標準字體做的楷書注音字型，專案寫明供低年級教育使用。多音字預設第一讀音，其他讀音用 IVS（U+E01E0 起）選。"

[font.source]
kind = "github-release"
repo = "ButTaiwan/bpmfvs"
tag = "v1.500"
asset = "BpmfZihiKaiStd.zip"
member = "BpmfZihiKaiStd-Regular.ttf"
license_members = ["LICENSE-ZihiKaiStd.txt", "NOTICE.txt", "LICENSE-2.0.txt"]

[font.license]
spdx = ["CC-BY-4.0", "OFL-1.1"]
summary = "漢字部分 CC BY 4.0，漢字以外 OFL 1.1；規格與程式 Apache 2.0。"
commercial = true
modify = true
attribution_required = true
reserved_names = ["字嗨", "Zihi"]
attribution = "字型：字嗨注音標楷 © 2020 But Ko（漢字 CC BY 4.0／其他 OFL 1.1），https://github.com/ButTaiwan/bpmfvs"
verified = "2026-11-12"

[font.web]
google_fonts = "Bpmf Zihi Kai Std"

[[font]]
id = "bpmf-iansui"
name = "注音芫荽"
name_en = "Bpmf Iansui"
